name: realtime-ml

x-app: &app
  image: realtime-ml-app:0.1.0
  build: { context: ., dockerfile: docker/app.Dockerfile }
  environment: &env
    RTML_DATA: /app/data/stack
    REDIS_URL: redis:6379
    KAFKA_BOOTSTRAP: kafka:9092
    MLFLOW_TRACKING_URI: http://mlflow:5000
    RTML_PG_DSN: postgresql://rtml:rtml-dev-only@postgres:5432/rtml
    RTML_REPLAY_DAY: "77"
    RTML_API: http://api:8000
    RTML_PROMETHEUS: http://prometheus:9090
    SKEW_BUG: ${SKEW_BUG:-0}
  volumes:
    - ./data:/app/data
    - ./results:/app/results

services:
  kafka:
    image: apache/kafka:4.3.1
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:19092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:19092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_NUM_PARTITIONS: 1
      KAFKA_HEAP_OPTS: -Xms256m -Xmx512m
    ports: ["19092:19092"]
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 5s
      retries: 30

  redis:
    image: redis:7.4.6-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports: ["6380:6379"]
    healthcheck: { test: ["CMD", "redis-cli", "ping"], interval: 5s, retries: 20 }

  postgres:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_USER: rtml
      POSTGRES_PASSWORD: rtml-dev-only
      POSTGRES_DB: rtml
    volumes:
      - ./ops/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports: ["5433:5432"]
    healthcheck: { test: ["CMD", "pg_isready", "-U", "rtml"], interval: 5s, retries: 20 }

  mlflow:
    image: realtime-ml-mlflow:3.17.0
    build: { context: ., dockerfile: docker/mlflow.Dockerfile }
    command: >
      mlflow server --host 0.0.0.0 --port 5000
      --backend-store-uri postgresql://rtml:rtml-dev-only@postgres:5432/mlflow
      --artifacts-destination /mlartifacts --serve-artifacts
      --allowed-hosts "*"
    volumes: [mlartifacts:/mlartifacts]
    ports: ["5050:5000"]
    depends_on: { postgres: { condition: service_healthy } }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 5s
      retries: 40

  prometheus:
    image: prom/prometheus:v3.5.0
    volumes:
      - ./ops/prometheus:/etc/prometheus:ro
    ports: ["9095:9090"]

  # One-shot jobs: `docker compose run --rm tools python -m ...`
  tools:
    <<: *app
    profiles: ["jobs"]
    depends_on:
      redis: { condition: service_healthy }
      postgres: { condition: service_healthy }
      mlflow: { condition: service_healthy }
      kafka: { condition: service_healthy }

  api:
    <<: *app
    command: ["uvicorn", "rtml.serve.app:app", "--host", "0.0.0.0", "--port", "8000", "--log-level", "warning"]
    ports: ["8800:8000"]
    profiles: ["serve"]
    depends_on:
      redis: { condition: service_healthy }
      postgres: { condition: service_healthy }
      mlflow: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')"]
      interval: 5s
      retries: 60

  processor:
    <<: *app
    command: ["python", "-m", "rtml.stream.processor"]
    profiles: ["serve"]
    depends_on:
      kafka: { condition: service_healthy }
      redis: { condition: service_healthy }

  monitor:
    <<: *app
    command: ["python", "-m", "rtml.monitor.service"]
    profiles: ["serve"]
    depends_on:
      postgres: { condition: service_healthy }
      mlflow: { condition: service_healthy }

volumes:
  mlartifacts:
