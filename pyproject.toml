[project]
name = "realtime-ml"
version = "0.1.0"
description = "Real-time fraud scoring with the leakage, skew and label-delay problems measured: Feast, LightGBM, MLflow, FastAPI shadow serving, drift monitoring and a gated promotion."
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [{ name = "Basant Bhattarai" }]
requires-python = ">=3.12,<3.13"
dependencies = [
    "feast[redis,duckdb]",
    "lightgbm",
    "mlflow-skinny",
    "confluent-kafka",
    "fastapi",
    "uvicorn",
    "httpx",
    "pandas",
    "pyarrow",
    "numpy",
    "scikit-learn",
    "prometheus-client",
    "psycopg[binary]",
    "evalproof @ git+https://github.com/technobasant/evalproof@v0.1.1",
]

[dependency-groups]
dev = ["pytest", "pytest-cov", "ruff", "mypy", "pandas-stubs", "types-redis"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rtml"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.uv]
# Supply-chain guard: never resolve a release younger than three days. Declared here,
# not only in a personal uv.toml, so uv.lock means the same thing on every machine.
exclude-newer = "3 days"

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]
plugins = []

[[tool.mypy.overrides]]
module = ["lightgbm.*", "feast.*", "mlflow.*", "sklearn.*", "confluent_kafka.*", "evalproof.*", "duckdb.*", "redis.*", "psycopg.*", "prometheus_client.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning", "ignore::FutureWarning", "ignore::UserWarning"]
