global:
  scrape_interval: 5s
  evaluation_interval: 5s
rule_files:
  - /etc/prometheus/alerts.yml
scrape_configs:
  - job_name: api
    static_configs: [{ targets: ["api:8000"] }]
  - job_name: processor
    static_configs: [{ targets: ["processor:9101"] }]
  - job_name: monitor
    static_configs: [{ targets: ["monitor:9102"] }]
